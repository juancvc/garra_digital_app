name: Mobile CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  analyze-test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        id: flutter_test
        run: |
          set +e
          flutter test --reporter expanded > test_out.txt 2>&1
          code=$?
          set -e
          # Keep last chunk in step summary (public on Actions UI)
          {
            echo '## flutter test tail'
            echo '```'
            tail -n 120 test_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit compact error annotation with likely failure lines
          fail_lines=$(grep -nE '\[E\]|Expected:|Actual:|Test failed|Which:|══╡|EXCEPTION CAUGHT' test_out.txt | tail -n 40 || true)
          if [ -n "$fail_lines" ]; then
            echo "::error::${fail_lines}"
          else
            echo "::error::No standard failure markers; see job summary tail"
          fi
          exit $code
      - run: flutter build apk --debug

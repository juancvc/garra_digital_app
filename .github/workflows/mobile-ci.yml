name: Mobile CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  analyze-test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test_out.txt
      - name: surface failing test name
        if: failure()
        run: |
          echo "::error::Failed tests:"
          grep -E '\[E\]|Some tests failed|Expected:|Actual:|Test failed|which:|package:flutter_test' test_out.txt | tail -n 80 || true
          exit 1
      - run: flutter build apk --debug

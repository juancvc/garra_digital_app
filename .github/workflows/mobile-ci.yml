name: Mobile CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  analyze-test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          set +e
          flutter test --reporter expanded > test_out.txt 2>&1
          code=$?
          set -e
          {
            echo '## flutter test failure excerpt'
            echo '```'
            # Prefer the exception block + surrounding context
            if grep -n 'EXCEPTION CAUGHT' test_out.txt >/dev/null; then
              line=$(grep -n 'EXCEPTION CAUGHT' test_out.txt | tail -n1 | cut -d: -f1)
              start=$((line > 30 ? line - 30 : 1))
              end=$((line + 80))
              sed -n "${start},${end}p" test_out.txt
            else
              tail -n 160 test_out.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation per line (keeps content visible via API)
          if [ "$code" -ne 0 ]; then
            if grep -n 'EXCEPTION CAUGHT' test_out.txt >/dev/null; then
              line=$(grep -n 'EXCEPTION CAUGHT' test_out.txt | tail -n1 | cut -d: -f1)
              start=$((line > 20 ? line - 20 : 1))
              end=$((line + 60))
              sed -n "${start},${end}p" test_out.txt | while IFS= read -r row; do
                echo "::error::$row"
              done
            else
              tail -n 60 test_out.txt | while IFS= read -r row; do
                echo "::error::$row"
              done
            fi
          fi
          exit $code
      - run: flutter build apk --debug

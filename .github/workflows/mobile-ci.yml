name: Mobile CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  analyze-test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Provide Maps placeholder for debug build
        run: echo "GOOGLE_MAPS_API_KEY=CI_BUILD_PLACEHOLDER" >> android/local.properties
      - run: flutter build apk --debug
